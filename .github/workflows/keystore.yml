name: Create keystore (run once)

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore hooshyar.jks -alias hooshyar -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Hooshyar, O=Hooshyar, C=IR"
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo "KEY_ALIAS=hooshyar"
            echo "KEYSTORE_BASE64=$(base64 -w0 hooshyar.jks)"
          } > keystore-info.txt
      - name: Upload (private artifact, 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-info
          path: |
            keystore-info.txt
            hooshyar.jks
          retention-days: 1

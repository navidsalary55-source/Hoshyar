name: Build release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate launcher icons from text files
        run: |
          rm -rf app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          base64 -d tools/ic_launcher.b64 > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          base64 -d tools/ic_launcher_round.b64 > app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          base64 -d tools/ic_launcher_foreground.b64 > app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Secret KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hooshyar.jks"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/hooshyar.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MYKET_RSA_KEY: ${{ secrets.MYKET_RSA_KEY }}
        run: gradle assembleBazaarRelease assembleMyketRelease --stacktrace

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/bazaar/release/app-bazaar-release.apk Hooshyar-bazaar.apk
          cp app/build/outputs/apk/myket/release/app-myket-release.apk Hooshyar-myket.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hooshyar-release-apks
          path: |
            Hooshyar-bazaar.apk
            Hooshyar-myket.apk
